global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/climbdesk-alerts.yml

scrape_configs:
  - job_name: climbdesk
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/climbdesk-token
    static_configs:
      - targets: [host.docker.internal:8080]
