spring:
  application:
    name: climbdesk
  rabbitmq:
    host: ${CLIMBDESK_RABBITMQ_HOST:localhost}
    port: ${CLIMBDESK_RABBITMQ_PORT:5672}
    username: ${CLIMBDESK_RABBITMQ_USERNAME:climbdesk}
    password: ${CLIMBDESK_RABBITMQ_PASSWORD:climbdesk}
    virtual-host: ${CLIMBDESK_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 1
  datasource:
    url: ${CLIMBDESK_DATASOURCE_URL}
    username: ${CLIMBDESK_DATASOURCE_USERNAME}
    password: ${CLIMBDESK_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    postgresql:
      transactional-lock: false
  jpa:
    hibernate:
      ddl-auto: validate

climbdesk:
  auth:
    jwt:
      secret: ${CLIMBDESK_JWT_SECRET:}
      expires-in: ${CLIMBDESK_JWT_EXPIRES_IN:3600}
  messaging:
    rabbitmq:
      enabled: ${CLIMBDESK_RABBITMQ_ENABLED:false}
      publisher-enabled: ${CLIMBDESK_RABBITMQ_PUBLISHER_ENABLED:false}
      listener-enabled: ${CLIMBDESK_RABBITMQ_LISTENER_ENABLED:false}
      publisher:
        poll-interval: ${CLIMBDESK_RABBITMQ_PUBLISHER_POLL_INTERVAL:1s}
        max-per-tick: ${CLIMBDESK_RABBITMQ_PUBLISHER_MAX_PER_TICK:20}
        max-attempts: ${CLIMBDESK_RABBITMQ_PUBLISHER_MAX_ATTEMPTS:5}
        confirm-timeout: ${CLIMBDESK_RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:5s}
        # retry-backoffs must contain max-attempts minus one entries.
        retry-backoffs: ${CLIMBDESK_RABBITMQ_PUBLISHER_RETRY_BACKOFFS:5s,30s,2m,10m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  health:
    rabbit:
      enabled: ${climbdesk.messaging.rabbitmq.enabled}
